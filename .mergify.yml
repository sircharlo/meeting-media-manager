queue_rules:
  - name: translations
    queue_conditions:
      - -draft
      - or:
          - author = github-actions[bot]
          - author = sircharlo
      - title ~= (new translations|update translations progress)
      - files ~= \.(md|json)$
      - -files ~= ^(?!.*\.(md|json)$)
      # Wait for the PR's own docs:lint before queueing. A corrupted Crowdin
      # export fails it until the Crowdin auto-repair workflow pushes its fix
      # commit, and a PR dequeued for failing checks is never requeued by a
      # new commit, only by hand. Gating entry here means the PR is first
      # queued once the repaired export passes.
      - or:
          - check-success = "docs:lint"
          - check-neutral = "docs:lint"
          - check-skipped = "docs:lint"
          - -files ~= ^docs/
    merge_conditions:
      - -draft
      - or:
          - check-success = "docs:lint"
          - check-neutral = "docs:lint"
          - check-skipped = "docs:lint"
          - -files ~= ^docs/
    batch_size: 10
  - name: bots
    queue_conditions:
      - -draft
      - or:
          - author = dependabot[bot]
          - author = github-actions[bot]
      - not: title ~= (new translations|update translations progress)
    merge_conditions:
      - -draft
      - or:
          - check-success = "build / Lint and test"
          - check-neutral = "build / Lint and test"
          - check-skipped = "build / Lint and test"
      - or:
          - check-success = "build / build (ubuntu-latest)"
          - check-neutral = "build / build (ubuntu-latest)"
          - check-skipped = "build / build (ubuntu-latest)"
      - or:
          - check-success = "build / build (macos-latest)"
          - check-neutral = "build / build (macos-latest)"
          - check-skipped = "build / build (macos-latest)"
      - or:
          - check-success = "build / build (windows-latest)"
          - check-neutral = "build / build (windows-latest)"
          - check-skipped = "build / build (windows-latest)"
      - and:
          - author = dependabot[bot]
          - or:
              - title ~= ^((chore|build)(\(deps(?:-dev)*\))*:) bump [^\s]+ from
                ([1-9][\d]*)\..+ to \4\.
              - title ~= ^((chore|build)(\(deps(-dev)?\))?:) bump the .+ group
                (across|with) .+ updates
    batch_size: 10
merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions: true
merge_queue:
  max_parallel_checks: 10
  skip_intermediate_results: true
  status_comments: outcomes
