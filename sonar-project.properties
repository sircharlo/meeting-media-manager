sonar.projectKey=sircharlo_meeting-media-manager
sonar.organization=sircharlo
sonar.python.version=3.12
sonar.sources=src,src-electron,scripts,docs/.vitepress,docs/data,docs/utils,.github,quasar.config.ts,vitest.config.mts,eslint.config.js,postcss.config.js
sonar.typescript.tsconfigPaths=tsconfig.json,docs/tsconfig.json
sonar.exclusions=**/*.png,**/*.bmp,.yarn/**,**/__tests__/**,**/*.test.ts,**/*.test.mts,test/**
sonar.tests=src,src-electron,docs,test
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.mts,test/**

# json:S2068 (hard-coded credentials) flags some translated UI labels whose
# i18n key mentions a password (e.g. "obsPassword": "Senha do @:obsWebSocket").
# These files only hold UI strings - the OBS password itself is user input
# and never part of them - and the translations are Crowdin-generated, so
# they can't be marked in place.
sonar.issue.ignore.multicriteria=i18nCredentialLabels
sonar.issue.ignore.multicriteria.i18nCredentialLabels.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.i18nCredentialLabels.resourceKey=src/i18n/**/*.json
