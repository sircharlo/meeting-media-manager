# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      vueuse:
        applies-to: version-updates
        patterns:
          - '@vueuse/*'
      sentry-plugins:
        applies-to: version-updates
        patterns:
          - '@sentry/*-plugin'
    ignore:
      # TypeScript 7.0 ships no JS API, which typescript-eslint and vue-tsc
      # both load TypeScript through (typescript-eslint will never support
      # 7.0). Revisit once 7.1 is out and both tools support it.
      - dependency-name: 'typescript'
        versions: ['7.0.x']
      # 11.12.0 uploads source maps with the new `sentry` CLI 0.49, which
      # injects a second debug ID snippet as a new first line into the copies
      # it uploads (and shifts their maps to match), while the app ships the
      # files without it: every stack frame of v26.11.3 was a line off and
      # unmapped. Pinned to 11.11.0 (CLI 0.45, uploads as is) in package.json.
      # Before lifting this, check that a release build's uploaded copy lines
      # up with the file it ships (see the PR that added this).
      - dependency-name: '@sentry/vite-plugin'
        versions: ['>= 11.12.0']
      - dependency-name: '@sentry/rollup-plugin'
        versions: ['>= 11.12.0']
    open-pull-requests-limit: 15
