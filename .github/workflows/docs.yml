name: Deploy Docs site to Pages

on:
  release:
    types: [released]
  push:
    branches:
      - master
    paths:
      - docs/**
      - src/constants/locales.ts
      - package.json
      - yarn.lock
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      # Linting and testing the docs runs no native code from dependencies,
      # so their install/postinstall scripts are skipped: a compromised
      # package then gets no chance to run code at install time.
      # --mode=skip-build is Yarn 4's install flag for that, and
      # YARN_ENABLE_SCRIPTS=false the config-level equivalent.
      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: yarn install --mode=skip-build
      - name: Prepare Quasar
        run: yarn quasar prepare
      - name: Lint files
        run: yarn docs:lint
      - name: Run tests
        run: yarn docs:test

  build:
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # Same as the quality job: the logos (sharp, prebuilt per platform) and
      # the VitePress build need no dependency build scripts.
      - run: yarn install --mode=skip-build
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - run: yarn quasar prepare
      - run: |
          yarn generate:logos
          yarn docs:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
