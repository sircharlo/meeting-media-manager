name: Refresh Yarn Lockfile

on:
  workflow_dispatch:

jobs:
  refresh-lockfile:
    name: Refresh lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      lockfile_branch: ${{ steps.branch.outputs.name }}
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - id: branch
        name: Set lockfile branch name
        run: echo "name=chore/refresh-lockfile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'

      - name: Delete lockfile
        run: rm -f yarn.lock

      # Only yarn.lock is kept from this install, and dependency builds never
      # change it. This is also the one install that resolves fresh, not yet
      # reviewed versions while holding a write token, so the dependencies'
      # install/postinstall scripts are skipped: a compromised package then
      # gets no chance to run code here. --mode=skip-build is Yarn 4's
      # install flag for that, and YARN_ENABLE_SCRIPTS=false the config-level
      # equivalent.
      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: yarn install --no-immutable --mode=skip-build

      - name: Commit and push lockfile branch
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --staged --quiet; then
            echo "No changes to yarn.lock, nothing to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh yarn.lock [skip ci]"
            git push origin "HEAD:${{ steps.branch.outputs.name }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
  merge-lockfile:
    name: Merge lockfile update
    needs: refresh-lockfile
    if: needs.refresh-lockfile.outputs.has_changes == 'true'
    uses: ./.github/workflows/pr-creator-and-waiter.yml
    with:
      head: ${{ needs.refresh-lockfile.outputs.lockfile_branch }}
      title: 'chore: refresh yarn.lock'
      body: 'Automated yarn.lock refresh.'
      admin: true
    secrets: inherit
