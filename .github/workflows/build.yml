name: Build

on:
  workflow_call:
    inputs:
      checkout-latest:
        description: 'Checkout the latest changes from the repository'
        type: boolean
      publish-release:
        description: 'Publish build artifacts to GitHub Releases via electron-builder'
        type: boolean
        default: false
    secrets:
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      MAC_CERTIFICATE_BASE64:
        required: true
      MAC_CERTIFICATE_PASSWORD:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_DSN:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # CI-2: the job-level continue-on-error above means a broken SonarQube
      # integration (e.g. an expired SONAR_TOKEN) would otherwise leave the
      # workflow run looking fully green with no signal anyone would notice
      # without deliberately drilling into this job. This makes a failure
      # loud (a workflow annotation, visible on the PR's Checks summary)
      # without removing continue-on-error itself - this job isn't a
      # dependency of anything else, so a real Sonar-side outage still
      # shouldn't be able to block merges.
      - name: Surface a failed SonarQube scan
        if: failure()
        run: |
          echo "::error::SonarQube scan failed - check that SONAR_TOKEN is still valid and review the Sonar dashboard. This job is non-blocking (continue-on-error), so merges aren't affected, but the integration itself needs attention."

  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install
      - name: Prepare Quasar
        run: yarn quasar prepare
      - name: Lint files
        run: yarn lint
      - name: Check for unused dependencies
        run: yarn depcheck
      - name: Run tests
        run: yarn test:unit

  robotjs-native:
    name: Build robotjs native (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: robotjs-darwin-arm64
            arch: arm64
            os: macos-latest
          - artifact: robotjs-darwin-x64
            arch: x64
            os: macos-15-intel
          - artifact: robotjs-win32-x64
            arch: x64
            os: windows-latest
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: master
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          architecture: ${{ matrix.arch }}
          cache: 'yarn'
          node-version: 24
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          architecture: ${{ matrix.arch }}
          node-version: 24
      - name: Install dependencies
        run: yarn install
      - name: Rebuild robotjs for Electron
        run: yarn exec electron-rebuild -f -m ./node_modules/robotjs --arch=${{ matrix.arch }}
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
      - name: Upload robotjs native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact }}
          path: node_modules/robotjs/build/Release/robotjs.node

  build:
    runs-on: ${{ matrix.os }}
    needs: [quality, robotjs-native]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install
      - name: Download robotjs native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/robotjs-native
          pattern: robotjs-*
      - name: Prepare robotjs native artifacts (macOS only)
        if: runner.os == 'macOS'
        run: |
          artifact_root="$RUNNER_TEMP/robotjs-native"
          prepared="$artifact_root/prepared"
          mkdir -p "$prepared"
          lipo -create \
            "$artifact_root/robotjs-darwin-x64/robotjs.node" \
            "$artifact_root/robotjs-darwin-arm64/robotjs.node" \
            -output "$prepared/robotjs-darwin-universal.node"
          cp "$artifact_root/robotjs-darwin-x64/robotjs.node" "$prepared/robotjs-darwin-x64.node"
          cp "$artifact_root/robotjs-darwin-arm64/robotjs.node" "$prepared/robotjs-darwin-arm64.node"
      - name: Prepare robotjs native artifacts (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'robotjs-native'
          $prepared = Join-Path $artifactRoot 'prepared'
          New-Item -ItemType Directory -Force $prepared | Out-Null
          Copy-Item (Join-Path $artifactRoot 'robotjs-win32-x64\robotjs.node') (Join-Path $prepared 'robotjs-win32-x64.node')
      - name: Install Apple certificate
        if: runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          echo "create variables"
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "import certificate"
          echo -n "$MAC_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          echo "create temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "import certificate to keychain"
          security import $CERTIFICATE_PATH -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Run security find-identity -v
        if: runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        run: security find-identity -v
      - name: Build Electron App
        id: build
        # `set -o pipefail` and `tee` are bash-isms: the default shell on
        # Windows runners is pwsh, where `set -o pipefail` fails (it parses
        # as Set-Variable -Option). Pin bash so this step behaves the same
        # on all three OSes and build-output.log is always produced for the
        # notarization check below.
        shell: bash
        run: |
          yarn generate:icons
          yarn generate:logos
          set -o pipefail
          yarn build --publish=${{ inputs.publish-release && 'always' || 'never' }} 2>&1 | tee build-output.log
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          ROBOTJS_NATIVE_ARTIFACTS_DIR: ${{ runner.temp }}/robotjs-native/prepared
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}

      # CI-3: continue-on-error above swallows ANY macOS build failure, not
      # just notarization - a real compile error looked identical to an
      # expired notarization agreement, misdirecting triage and burning a
      # full extra build cycle every time. "Failed to notarize via
      # notarytool"/"Failed to staple" are @electron/notarize's own actual
      # thrown-error text (node_modules/@electron/notarize/lib/notarytool.js,
      # staple.js) - not a guess, read directly from the installed version -
      # so this narrows the retry to genuine notarization failures only.
      - name: Check whether the macOS failure was notarization-specific
        id: notarization-check
        if: runner.os == 'macOS' && steps.build.outcome == 'failure'
        run: |
          if grep -qE "Failed to notarize via notarytool|Failed to staple" build-output.log; then
            echo "was-notarization=true" >> "$GITHUB_OUTPUT"
          else
            echo "was-notarization=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry build without notarization (macOS agreement expired)
        if: runner.os == 'macOS' && steps.build.outcome == 'failure' && steps.notarization-check.outputs.was-notarization == 'true'
        run: |
          echo "::warning::macOS notarization failed — likely an expired agreement. Producing unsigned build."
          yarn build --publish=${{ inputs.publish-release && 'always' || 'never' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROBOTJS_NATIVE_ARTIFACTS_DIR: ${{ runner.temp }}/robotjs-native/prepared
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}

      - name: Fail fast on a non-notarization macOS build failure
        if: runner.os == 'macOS' && steps.build.outcome == 'failure' && steps.notarization-check.outputs.was-notarization == 'false'
        run: |
          echo "::error::macOS build failed for a reason unrelated to notarization - see the 'Build Electron App' step's log above. Not retrying (that would just fail again while masking the real cause)."
          exit 1
      - name: Clean up keychain and provisioning profile
        if: always() && runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        run: |
          rm -f $RUNNER_TEMP/build_certificate.p12
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
      - name: Upload artifacts
        if: ${{ !inputs.publish-release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: M³ test build for ${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
          path: |
            dist/electron/Packaged/*.exe
            dist/electron/Packaged/*.dmg
            dist/electron/Packaged/*.zip
            dist/electron/Packaged/*.AppImage
            dist/electron/Packaged/*/*/Contents/Info.plist
