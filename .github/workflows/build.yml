name: Build

on:
  workflow_call:
    inputs:
      checkout-latest:
        description: 'Checkout the latest changes from the repository'
        type: boolean
      publish-release:
        description: 'Publish build artifacts to GitHub Releases via electron-builder'
        type: boolean
        default: false
      quality-only:
        description: 'Run only the lint and unit-test checks, without packaging the app'
        type: boolean
        default: false
      ref:
        description: 'With checkout-latest, the commit to build instead of the latest master'
        type: string
        default: ''
    secrets:
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      MAC_CERTIFICATE_BASE64:
        required: true
      MAC_CERTIFICATE_PASSWORD:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_DSN:
        required: true
      # The Snap Store upload's credentials (`snapcraft export-login`), for
      # release builds only. Without them, the snap job builds the snap but
      # doesn't upload it.
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Nothing new to scan in quality-only mode, and this job cannot gate a
    # merge anyway (continue-on-error below), so it stays out of that mode.
    # Nor when building a given branch (`ref`, the automated updates' build
    # gates): its checkout below is the triggering ref, master, so it would
    # only scan master again rather than the branch.
    if: ${{ !inputs.quality-only && inputs.ref == '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # The scan type-checks with the app's own tsconfig.json (which extends
      # the generated .quasar/tsconfig.json for the path aliases and the
      # *.vue shim), so dependencies and Quasar's generated types must exist
      # first - otherwise every external type is `any` and the type-aware
      # rules report the wrong things.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      # The scan only reads the dependencies' sources and types, never their
      # build output, so their install/postinstall scripts are skipped: a
      # compromised package then gets no chance to run code at install time.
      # --mode=skip-build is Yarn 4's install flag for that, and
      # YARN_ENABLE_SCRIPTS=false the config-level equivalent.
      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: yarn install --immutable --mode=skip-build
      - name: Prepare Quasar
        run: yarn quasar prepare
      - name: SonarQube Scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # CI-2: the job-level continue-on-error above means a broken SonarQube
      # integration (e.g. an expired SONAR_TOKEN) would otherwise leave the
      # workflow run looking fully green with no signal anyone would notice
      # without deliberately drilling into this job. This makes a failure
      # loud (a workflow annotation, visible on the PR's Checks summary)
      # without removing continue-on-error itself - this job isn't a
      # dependency of anything else, so a real Sonar-side outage still
      # shouldn't be able to block merges.
      - name: Surface a failed SonarQube scan
        if: failure()
        run: |
          echo "::error::SonarQube scan failed - check that SONAR_TOKEN is still valid and review the Sonar dashboard. This job is non-blocking (continue-on-error), so merges aren't affected, but the integration itself needs attention."

  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'master' }}
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install # NOSONAR: gates the Build job, so it installs exactly like Build does (dependency build scripts on); CI only installs the immutable, checksum-verified yarn.lock
      - name: Prepare Quasar
        run: yarn quasar prepare
      - name: Lint files
        run: yarn lint
      - name: Check for unused dependencies
        run: yarn depcheck
      - name: Run tests
        run: yarn test:unit

  build:
    runs-on: ${{ matrix.os }}
    needs: [quality]
    # Callers that only need the checks turn the packaging off: the version
    # bump branch (whose content the release build rebuilds minutes later) is
    # the case this exists for. Everything else keeps the full matrix.
    if: ${{ !inputs.quality-only }}
    # The arm64 AppImage (ubuntu-24.04-arm, GitHub's ARM runner) is a new
    # build, made for betas and releases only, which nobody has tested on an
    # ARM computer yet: its failure mustn't hold up the release, so it's
    # reported loudly instead (last step).
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        os: ${{ fromJSON(true && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'master' }}
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install # NOSONAR: the release build keeps dependency build scripts on (robotjs/ttf2woff2 native addons, sentry-cli binary check); CI only installs the immutable, checksum-verified yarn.lock
      - name: Install Apple certificate
        if: runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          echo "create variables"
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "import certificate"
          echo -n "$MAC_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          echo "create temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "import certificate to keychain"
          security import $CERTIFICATE_PATH -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Run security find-identity -v
        if: runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        run: security find-identity -v
      - name: Build Electron App
        id: build
        # `set -o pipefail` and `tee` are bash-isms: the default shell on
        # Windows runners is pwsh, where `set -o pipefail` fails (it parses
        # as Set-Variable -Option). Pin bash so this step behaves the same
        # on all three OSes and build-output.log is always produced for the
        # notarization check below.
        shell: bash
        run: |
          yarn generate:icons
          yarn generate:logos
          set -o pipefail
          yarn build --publish=${{ inputs.publish-release && 'always' || 'never' }} 2>&1 | tee build-output.log
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Ubuntu 26.04's gcc 15 compiles C as C23 by default, where an
          # implicit function declaration is an error: robotjs 0.9.1's
          # src/xdisplay.c calls strdup() and includes only <stdio.h> and
          # <stdlib.h>, so the forced rebuild of the module failed there.
          # Preinclude <string.h> so strdup gets its real declaration - the
          # same include the file is missing, without editing it. Turning the
          # diagnostic off instead would build strdup as returning int and
          # truncate the pointer it returns on 64-bit. Linux only: MSVC and
          # clang spell preincludes differently, and only gcc 15 needs it.
          CFLAGS: ${{ runner.os == 'Linux' && '-include string.h' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}

      # CI-3: continue-on-error above swallows ANY macOS build failure, not
      # just notarization - a real compile error looked identical to an
      # expired notarization agreement, misdirecting triage and burning a
      # full extra build cycle every time. "Failed to notarize via
      # notarytool"/"Failed to staple" are @electron/notarize's own actual
      # thrown-error text (node_modules/@electron/notarize/lib/notarytool.js,
      # staple.js) - not a guess, read directly from the installed version -
      # so this narrows the retry to genuine notarization failures only.
      - name: Check whether the macOS failure was notarization-specific
        id: notarization-check
        if: runner.os == 'macOS' && steps.build.outcome == 'failure'
        run: |
          if grep -qE "Failed to notarize via notarytool|Failed to staple" build-output.log; then
            echo "was-notarization=true" >> "$GITHUB_OUTPUT"
          else
            echo "was-notarization=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry build without notarization (macOS agreement expired)
        if: runner.os == 'macOS' && steps.build.outcome == 'failure' && steps.notarization-check.outputs.was-notarization == 'true'
        run: |
          echo "::warning::macOS notarization failed — likely an expired agreement. Producing unsigned build."
          yarn build --publish=${{ inputs.publish-release && 'always' || 'never' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}

      - name: Fail fast on a non-notarization macOS build failure
        if: runner.os == 'macOS' && steps.build.outcome == 'failure' && steps.notarization-check.outputs.was-notarization == 'false'
        run: |
          echo "::error::macOS build failed for a reason unrelated to notarization - see the 'Build Electron App' step's log above. Not retrying (that would just fail again while masking the real cause)."
          exit 1
      - name: Clean up keychain and provisioning profile
        if: always() && runner.os == 'macOS' && github.actor != 'dependabot[bot]'
        run: |
          rm -f $RUNNER_TEMP/build_certificate.p12
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
      - name: '[TEMP] Smoke-test the arm64 AppImage'
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -x
          ls -la dist/electron/Packaged/
          cat dist/electron/Packaged/*.yml || true
          app=$(ls "$PWD"/dist/electron/Packaged/*.AppImage)
          file "$app"
          chmod +x "$app"
          cd "$RUNNER_TEMP"
          "$app" --appimage-extract > /dev/null
          file squashfs-root/meeting-media-manager squashfs-root/resources/ffmpeg/bin/ffmpeg
          squashfs-root/resources/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
          find squashfs-root -name '*.node' -exec file {} +
          sudo apt-get install -y xvfb > /dev/null
          ELECTRON_RUN_AS_NODE=1 xvfb-run -a squashfs-root/meeting-media-manager -e "const r = require('$RUNNER_TEMP/squashfs-root/resources/app.asar/node_modules/robotjs'); console.log('robotjs loaded:', typeof r.keyTap, JSON.stringify(r.getScreenSize()))"
          set +e
          timeout 45 xvfb-run -a squashfs-root/meeting-media-manager --no-sandbox > app.log 2>&1
          status=$?
          tail -n 60 app.log
          echo "exit status: $status (124 = still running after 45 s)"
          [ "$status" -eq 124 ]
      - name: Upload artifacts
        if: ${{ !inputs.publish-release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: M³ test build for ${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'ubuntu-24.04-arm' && 'Linux (arm64)' || 'Linux' }}
          path: |
            dist/electron/Packaged/*.exe
            dist/electron/Packaged/*.dmg
            dist/electron/Packaged/*.zip
            dist/electron/Packaged/*.AppImage
            dist/electron/Packaged/*/*/Contents/Info.plist
      - name: Surface a failed arm64 build
        if: failure() && matrix.os == 'ubuntu-24.04-arm'
        run: |
          echo "::error::The arm64 Linux build failed - see its log. It doesn't fail the workflow (continue-on-error), so the release isn't held up, but it has no arm64 AppImage, and arm64 AppImages already installed get no update."

  # The Snap Store build: the same app as the Linux build's AppImage, packed
  # as a snap instead (M3_SNAP, see quasar.config.ts). A job of its own, as
  # snapcraft builds in an LXD container, and one that can't fail the
  # workflow: the Snap Store is a new channel, and an LXD or Snap Store
  # outage, or expired credentials, mustn't hold up a pull request or the
  # GitHub release. Its failure is reported loudly instead (last step).
  # Betas and releases also build the arm64 snap, on GitHub's ARM runner
  # (snapcraft builds for the machine it runs on).
  snap:
    name: build (snap${{ matrix.runner == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.runner }}
    needs: [quality]
    if: ${{ !inputs.quality-only }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      matrix:
        runner: ${{ fromJSON(true && '["ubuntu-latest", "ubuntu-24.04-arm"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'master' }}
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install # NOSONAR: the same install as the Linux build's (dependency build scripts on, for the robotjs native addon); CI only installs the immutable, checksum-verified yarn.lock
      # snapcraft builds the snap in an LXD container, and electron-builder
      # runs it as the runner's user: the action gives that user's group
      # (adm) LXD's socket, and lets the container's traffic past Docker's
      # firewall rules.
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/stable
      # Snapcraft 8, which electron-builder 26 writes its snapcraft.yaml for.
      # Snapcraft 9 no longer copies snap/gui into meta/gui before it looks
      # for an app's desktop file, so the build fails on the desktop file
      # electron-builder puts there: "Failed to generate desktop file
      # '/root/project/snap/meta/gui/meeting-media-manager.desktop': file
      # does not exist".
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Build the snap
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build --publish=never
        env:
          # See the Linux build's step above.
          CFLAGS: '-include string.h'
          M3_SNAP: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}
      # A beta goes straight to the beta channel, like its GitHub release. A
      # release is only uploaded: it's built for a draft, so it reaches the
      # stable channel when the draft is published (store-release.yml).
      # Until the repository has the credentials, the snap is only built.
      - name: Upload to the Snap Store
        if: ${{ inputs.publish-release }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::The snap was built but not uploaded: the repository has no SNAPCRAFT_STORE_CREDENTIALS secret."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          snaps=(dist/electron/Packaged/*.snap)
          case "$version" in
            *-beta*)
              echo "Uploading ${snaps[*]} ($version) to the beta channel"
              snapcraft upload --release=beta "${snaps[@]}"
              ;;
            *)
              echo "Uploading ${snaps[*]} ($version), to be released to stable with the GitHub release"
              snapcraft upload "${snaps[@]}"
              ;;
          esac
      - name: '[TEMP] Inspect and start the arm64 snap'
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          set -x
          ls -la dist/electron/Packaged/
          snap=$(ls "$PWD"/dist/electron/Packaged/*.snap)
          sudo apt-get install -y squashfs-tools xvfb > /dev/null
          unsquashfs -n -d "$RUNNER_TEMP/snap" "$snap" > /dev/null
          head -n 30 "$RUNNER_TEMP/snap/meta/snap.yaml"
          for name in meeting-media-manager ffmpeg '*.node'; do find "$RUNNER_TEMP/snap" -type f -name "$name" -exec file {} +; done
          sudo snap install --dangerous "$snap"
          snap list meeting-media-manager
          set +e
          timeout 45 xvfb-run -a snap run meeting-media-manager > snap-app.log 2>&1
          echo "exit status: $? (124 = still running after 45 s)"
          tail -n 60 snap-app.log
          exit 0
      - name: Upload artifacts
        if: ${{ !inputs.publish-release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: M³ test build for Linux (snap${{ matrix.runner == 'ubuntu-24.04-arm' && ', arm64' || '' }})
          path: dist/electron/Packaged/*.snap
      - name: Surface a failed snap build
        if: failure()
        run: |
          echo "::error::The snap job failed - see its log. It doesn't fail the workflow (continue-on-error), so pull requests and the GitHub release aren't held up, but the Snap Store didn't get this build."

  # The Microsoft Store build: the same app as the Windows build's installer,
  # packed as an MSIX instead (M3_MSIX, see quasar.config.ts). The Store signs
  # it, so it isn't signed here. A job of its own, like the snap's, that can't
  # fail the workflow: the Microsoft Store is a new channel, and its failure
  # mustn't hold up a pull request or the GitHub release. Its failure is
  # reported loudly instead (last step).
  msix:
    name: build (msix)
    runs-on: windows-latest
    needs: [quality]
    if: ${{ !inputs.quality-only }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out master branch
        if: ${{ inputs.checkout-latest == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'master' }}
      - name: Check out Git repository
        if: ${{ inputs.checkout-latest == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: ${{ !inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - name: Setup Node without cache for release publishing
        if: ${{ inputs.publish-release }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install # NOSONAR: the same install as the Windows build's (dependency build scripts on, for the robotjs native addon); CI only installs the immutable, checksum-verified yarn.lock
      - name: Build the MSIX
        shell: bash
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build --publish=never
        env:
          M3_MSIX: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TEST_VERSION: ${{ !inputs.publish-release }}
      # A release's MSIX is what goes to Partner Center: store-release.yml
      # submits it once the release is published (the first submission, with
      # the Store listing, is made there by hand).
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.publish-release && 'M³ for the Microsoft Store' || 'M³ test build for Windows (MSIX)' }}
          path: dist/electron/Packaged/*.appx
      - name: Surface a failed MSIX build
        if: failure()
        run: |
          echo "::error::The MSIX job failed - see its log. It doesn't fail the workflow (continue-on-error), so pull requests and the GitHub release aren't held up, but there's no MSIX for the Microsoft Store from this build."
